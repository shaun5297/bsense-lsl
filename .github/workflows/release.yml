name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
      - name: Install build dependencies
        run: python -m pip install ".[release]"
      - name: Run protocol and unit tests
        run: |
          python -m bsense_experiment --self-test
          python -m unittest discover -s tests -v
      - name: Build Windows x64 archive
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python tools/build_release.py --output-dir release
      - name: Build and validate tagged Windows x64 archive
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: python tools/build_release.py --output-dir release --expected-tag "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bsense-lsl-windows-x64
          path: release/*
          if-no-files-found: error
          compression-level: 0

  build-macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "arm64"
          cache: "pip"
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Install build dependencies
        run: python -m pip install ".[release]"
      - name: Run protocol and unit tests
        run: |
          python -m bsense_experiment --self-test
          python -m unittest discover -s tests -v
      - name: Build macOS ARM64 archive
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python tools/build_release.py --output-dir release
      - name: Build and validate tagged macOS ARM64 archive
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: python tools/build_release.py --output-dir release --expected-tag "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bsense-lsl-macos-arm64
          path: release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build-windows-x64
      - build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: bsense-lsl-*
          path: release-assets
          merge-multiple: true
      - name: Combine checksums
        run: cat release-assets/*.sha256 | sort > release-assets/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*.zip
          release-assets/SHA256SUMS.txt
          --verify-tag
          --generate-notes
          --title "BSense LSL ${GITHUB_REF_NAME}"
