name: test

on:
  push:
  pull_request:

jobs:
  cross-platform:
    strategy:
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Windows setup smoke test
        if: runner.os == 'Windows'
        shell: cmd
        env:
          BSENSE_NONINTERACTIVE: "1"
        run: windows\setup.bat
      - name: Install
        run: python -m pip install -e .
      - name: Protocol self-test
        run: python -m bsense_experiment --self-test
      - name: Unit tests
        run: python -m unittest discover -s tests -v
