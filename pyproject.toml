[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsense-lsl"
version = "0.8.0"
description = "Cross-platform LSL monitoring, experiment control, and built-in XDF recording for BSense-R"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pylsl==1.18.2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
voice-generation = [
  "edge-tts==7.2.8",
]

[project.scripts]
bsense-experiment = "bsense_experiment.app:main"
bsense-monitor = "bsense_experiment.monitor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bsense_experiment = ["audio/*.wav"]
